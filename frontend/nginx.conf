server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The simulator can wait on a burst of upstream calls.
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # API + proxy traffic -> gateway Service (load-balanced across gateway pods).
    location /api/ { proxy_pass http://gateway:8000; }
    location /v1/  { proxy_pass http://gateway:8000; proxy_buffering off; }
    location = /health { proxy_pass http://gateway:8000; }
    location = /ready  { proxy_pass http://gateway:8000; }
    location /docs { proxy_pass http://gateway:8000; }
    location = /openapi.json { proxy_pass http://gateway:8000; }

    # SPA (HashRouter) static files.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
