# Gateway: proxy data plane + admin API. Stateless, so it scales horizontally
# (HPA in hpa.yaml). The Service load-balances connections across pods.
apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: acg
spec:
  selector: { app: gateway }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: acg
spec:
  replicas: 2
  selector: { matchLabels: { app: gateway } }
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    metadata: { labels: { app: gateway } }
    spec:
      terminationGracePeriodSeconds: 20
      containers:
        - name: gateway
          image: acg-backend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          envFrom:
            - configMapRef: { name: acg-config }
            - secretRef: { name: acg-secrets }
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 3
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 160Mi }
            limits: { cpu: 500m, memory: 384Mi }
