# Dashboard (nginx). LoadBalancer: Docker Desktop publishes it on localhost:8080.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: acg
spec:
  type: LoadBalancer
  selector: { app: frontend }
  ports: [{ port: 8080, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: acg
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      containers:
        - name: frontend
          image: acg-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
