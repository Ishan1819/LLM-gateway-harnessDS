# alert-worker: 2 replicas for availability; only the elected leader scans.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-worker
  namespace: acg
spec:
  replicas: 2
  selector: { matchLabels: { app: alert-worker } }
  template:
    metadata: { labels: { app: alert-worker } }
    spec:
      terminationGracePeriodSeconds: 15
      containers:
        - name: alert-worker
          image: acg-backend:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.workers.alert_worker"]
          envFrom:
            - configMapRef: { name: acg-config }
            - secretRef: { name: acg-secrets }
          env:
            - { name: POD_NAME, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
